spring:
  application:
    name: timeback-backup-server
  datasource:
    url: ${TIMEBACK_DB_URL:jdbc:h2:mem:timeback;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: ${TIMEBACK_DB_USER:sa}
    password: ${TIMEBACK_DB_PASSWORD:}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false

server:
  port: ${TIMEBACK_SERVER_PORT:8080}
  shutdown: graceful
